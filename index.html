from pathlib import Path
html = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KS Lounge - Countdown Sports Events</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Montserrat,sans-serif;background:#0b0b0d;color:#fff}
header{background:linear-gradient(90deg,#1a1a1a,#0b0b0d);padding:25px;text-align:center;border-bottom:3px solid #FFD700;position:sticky;top:0}
h1{color:#FFD700}nav{display:flex;justify-content:center;gap:10px;margin-top:15px;flex-wrap:wrap}
button{padding:10px 20px;border:2px solid #FFD700;background:#111;color:#fff;border-radius:10px;cursor:pointer}
button.active,button:hover{background:#FFD700;color:#000}
.hero{height:40vh;display:flex;align-items:center;justify-content:center;background:#111}.hero h2{color:#FFD700}
section{max-width:1200px;margin:auto;padding:40px}.events{display:flex;flex-direction:column;gap:20px}
.event-card{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#111;padding:20px;border-left:6px solid #FFD700;border-radius:15px}
.event-info{display:flex;align-items:center;gap:15px}.event-info img{width:50px;height:50px;background:#222;padding:4px}
.countdown-badge{border:2px solid #FFD700;padding:8px 15px;border-radius:25px;color:#FFD700;font-weight:bold}
</style>
</head>
<body>
<header><h1>KS Lounge</h1><nav>
<button class="active" onclick="filterEvents('All')">All</button>
<button onclick="filterEvents('UFC')">UFC</button>
<button onclick="filterEvents('WWE')">WWE</button>
<button onclick="filterEvents('AEW')">AEW</button>
</nav></header>
<div class="hero"><h2>Live Countdown Sports Events</h2></div>
<section><div id="events-list" class="events"></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
<script>
const logos={
UFC:"https://upload.wikimedia.org/wikipedia/commons/9/92/UFC_Logo.svg",
WWE:"https://upload.wikimedia.org/wikipedia/commons/c/c4/WWE_official_logo.svg",
AEW:"https://upload.wikimedia.org/wikipedia/commons/7/77/All_Elite_Wrestling_logo_2024.svg"};
const manual=[
{name:"AEW All In: London",date:"2026-08-30T15:30:00Z",category:"AEW",location:"Wembley Stadium, London, England"},
{name:"WWE Saturday Night's Main Event",date:"2026-09-07T00:00:00Z",category:"WWE",location:"Atlanta, Georgia, USA"},
{name:"AEW All Out",date:"2026-09-27T00:00:00Z",category:"AEW",location:"Chicago, Illinois, USA"},
{name:"WWE Money in the Bank",date:"2026-10-10T23:00:00Z",category:"WWE",location:"New Orleans, Louisiana, USA"},
{name:"WWE Survivor Series: WarGames",date:"2026-11-28T23:00:00Z",category:"WWE",location:"Houston, Texas, USA"}
];
let events=[],filtered="All";
async function loadUFC(){
try{
const r=await fetch("https://raw.githubusercontent.com/clarencechaan/ufc-cal/ics/UFC.ics");
const t=await r.text();
const j=ICAL.parse(t);const c=new ICAL.Component(j);
c.getAllSubcomponents("vevent").forEach(v=>{const e=new ICAL.Event(v);const d=e.startDate.toJSDate();if(d>new Date())events.push({name:e.summary,date:d,category:"UFC",location:e.location||"TBA"});});
}catch(e){}
manual.forEach(ev=>{if(new Date(ev.date)>new Date())events.push(ev);});
render();
}
function render(){
const list=document.getElementById("events-list");list.innerHTML="";
events.sort((a,b)=>new Date(a.date)-new Date(b.date));
events.forEach(ev=>{
if(filtered!="All"&&ev.category!=filtered)return;
const d=new Date(ev.date);const id="i"+Math.random().toString(36).slice(2);
list.innerHTML+=`<div class="event-card"><div class="event-info"><img src="${logos[ev.category]}"><div><h3>${ev.name}</h3><p>${ev.category} • ${ev.location} • ${d.toUTCString()}</p></div></div><div class="countdown-badge" id="${id}"></div></div>`;
setTimeout(()=>countdown(d,id),0);
});
}
function countdown(t,id){const e=document.getElementById(id);function u(){let x=t-new Date();if(x<=0){e.textContent="Live Now!";return}let D=Math.floor(x/864e5),H=Math.floor(x%864e5/36e5),M=Math.floor(x%36e5/6e4),S=Math.floor(x%6e4/1e3);e.textContent=`${D}d ${H}h ${M}m ${S}s`;}u();setInterval(u,1000);}
function filterEvents(c){filtered=c;document.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.textContent===c));render();}
loadUFC();
</script>
</body></html>"""
path="/mnt/data/index.html"
Path(path).write_text(html,encoding="utf-8")
print(path)
